<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 步骤4：引入视口标签，开启响应式 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人网页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 步骤2：使用语义化标签构建骨架 -->
    <div class="container">
        <!-- 头部导航区 -->
        <header class="navbar">
            <div class="logo">MyPortfolio</div>
            <nav class="nav-links">
                <a href="#home">首页</a>
                <a href="#about">关于我</a>
                <a href="#skills">技能</a>
                <a href="#contact">联系</a>
            </nav>
        </header>

        <!-- 首屏展示区 -->
        <section id="home" class="hero">
            <h1>你好，我是张三</h1>
            <p>热爱自然风景与前端开发的设计师</p>
            <button class="btn">查看我的作品</button>
        </section>

        <!-- 主体内容区：技能展示 -->
        <main class="main-content">
            <section id="skills" class="skills-section">
                <h2>专业技能</h2>
                <div class="skills-grid">
                    <div class="skill-card">HTML5 / CSS3</div>
                    <div class="skill-card">JavaScript</div>
                    <div class="skill-card">UI / UX 设计</div>
                    <div class="skill-card">响应式布局</div>
                </div>
            </section>
        </main>

        <!-- 底部信息区 -->
        <footer class="footer">
            <p>&copy; 2026 张三的个人网页. 保留所有权利.</p>
        </footer>
    </div>
</body>
</html>
